<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tip Calculator</title>
<style>
body{font-family:Arial,sans-serif;background:#f0f0f0;padding:20px;}
.container{max-width:400px;margin:auto;background:#fff;padding:20px;border-radius:8px;box-shadow:0 2px 5px rgba(0,0,0,0.1);}
input{width:100%;padding:10px;margin:5px 0;font-size:1rem;}
button{width:100%;padding:10px;background:#28a745;color:#fff;border:none;border-radius:5px;font-size:1rem;cursor:pointer;}
.result{margin-top:15px;font-size:1.2rem;}
</style>
</head>
<body>
<div class="container">
<h2>Tip Calculator</h2>
<label>Bill Amount ($):</label>
<input type="number" id="bill" placeholder="e.g., 50" min="0" step="0.01">
<label>Tip %:</label>
<input type="number" id="tip" placeholder="e.g., 15" min="0" step="0.1">
<button onclick="calculate()">Calculate</button>
<div class="result" id="output"></div>
</div>
<script>
function calculate(){
  const bill = parseFloat(document.getElementById('bill').value)||0;
  const tipPercent = parseFloat(document.getElementById('tip').value)||0;
  const tip = bill * tipPercent / 100;
  const total = bill + tip;
  document.getElementById('output').innerHTML = `Tip: $${tip.toFixed(2)}<br>Total: $${total.toFixed(2)}`;
}
</script>
</body>
</html>
